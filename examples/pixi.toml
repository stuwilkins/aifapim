[workspace]
authors = []
channels = ["conda-forge"]
description = "AIF APIM gateway smoke-test example"
name = "aifapim-examples"
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]
version = "0.1.0"

[tasks]
# Smoke-test the deployed APIM gateway. Requires AIFAPIM_HOST and
# AIFAPIM_API_KEY exported in the environment (see test-apim.py header).
example = "python test-apim.py"

[dependencies]
python = "*"
openai = "*"
anthropic = "*"
rich = "*"
