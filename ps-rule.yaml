---
# PSRule for Azure configuration.
# Docs: https://azure.github.io/PSRule.Rules.Azure/
#
# The stack is analysed through the parameter file: .bicepparam files are
# expanded to ARM JSON (aifapim.example.bicepparam uses aifapim.bicep). Bare
# .bicep files are not expanded; aifapim.bicep and the reference workbook have
# required parameters without defaults and cannot be expanded on their own.
# Run manually in-sandbox: pixi run -e dev lint-psrule
# CI: .github/workflows/psrule.yml (advisory — SARIF only, does not fail build)

input:
  pathIgnore:
    - ".git/"
    - ".pixi/"
    - ".mypy_cache/"
    - "examples/"
    - "resources/"
    - "api_definitions/"
    - "apim_policies/"
    - "diagrams/"
    - "modules/"
    - "*.json"
    - "*.toml"
    - "*.lock"
    - "*.md"
    - "*.yaml"
    - "*.yml"

configuration:
  AZURE_BICEP_FILE_EXPANSION: false
  AZURE_BICEP_PARAMS_FILE_EXPANSION: true
  AZURE_BICEP_FILE_EXPANSION_TIMEOUT: 120

baseline:
  name: Azure.GA_2025_12

rule:
  exclude:
    # APIM availability zones and multi-region require Premium SKU.
    # This deployment uses Developer SKU (no SLA/HA); these rules are N/A.
    # Revisit if SKU is upgraded to Premium.
    - Azure.APIM.AvailabilityZone
    - Azure.APIM.MultiRegion
    # Log Analytics workspace replication is a Premium-tier feature.
    # N/A for the current PerGB2018 SKU.
    - Azure.Log.Replication
    # Event Hub zone-redundancy requires Standard+ SKU.
    # N/A for the current Standard SKU (zone redundancy opt-in not available
    # in all regions and requires namespace-level migration).
    - Azure.EventHub.AvailabilityZone
    # The inference policies deliberately have no <base /> in <backend>: APIM
    # allows one backend policy and <base /> plus <retry> fails deploy
    # validation (see AGENTS.md). The catalog policy has none in <inbound>, as
    # it only filters by IP and returns a static body.
    - Azure.APIM.PolicyBase
    # Defender for APIs requires subscription-level enablement of the
    # Microsoft.Security/defenderForApisComponents plan — not a Bicep
    # resource property. Enable at the subscription level separately.
    - Azure.APIM.DefenderCloud
    # Request body log (requestBodyLogging): the storage accounts use locally
    # redundant storage on purpose to start with. Switching an account to GRS
    # later is an in-place SKU change that also works after the immutability
    # policy is locked.
    - Azure.Storage.UseReplication
    # Request body log: the loader is a Flex Consumption function app (FC1). It
    # scales to zero, has no HTTP trigger, and does not expose instance count,
    # availability zone or ARR affinity settings that these rules check.
    - Azure.AppService.PlanInstanceCount
    - Azure.AppService.AvailabilityZone
    - Azure.AppService.HTTP2
    - Azure.AppService.ARRAffinity
    # Flex Consumption does not take every web-config property (ftpsState is
    # rejected), so siteConfig is limited to app settings. The platform default
    # minimum TLS version for new apps is 1.2 and the app is HTTPS only.
    - Azure.AppService.MinTLS
