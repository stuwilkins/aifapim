---
# Canonical lint configuration. Runs locally on commit and in CI via
# the Lint workflow (.github/workflows/lint.yml). Tool versions are
# pinned in pixi.toml [feature.dev.dependencies] for system hooks and
# via rev: for upstream pre-commit-managed hooks.

repos:
  # ────────────────────────────────────────────────────────────────
  # Generic hygiene + syntax checks
  # ────────────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--unsafe"]
      - id: check-json
      - id: check-toml
      - id: check-added-large-files

  # ────────────────────────────────────────────────────────────────
  # Spelling
  # ────────────────────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: codespell
        name: codespell (pixi dev)
        language: system
        entry: pixi run --frozen -e dev codespell
        types: [text]
        exclude: '(\.bicepparam|pixi\.lock)$'

  # ────────────────────────────────────────────────────────────────
  # Markdown
  # ────────────────────────────────────────────────────────────────
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.48.0
    hooks:
      - id: markdownlint
        name: Markdownlint
        entry: markdownlint --fix

  # ────────────────────────────────────────────────────────────────
  # GitHub Actions
  # ────────────────────────────────────────────────────────────────
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # ────────────────────────────────────────────────────────────────
  # Secrets
  # ────────────────────────────────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # ────────────────────────────────────────────────────────────────
  # Bicep — native linter (runs az bicep build per file)
  # Requires: az bicep install (one-time, see README activation steps)
  # ────────────────────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: bicep-build
        name: bicep build (az)
        language: system
        entry: az bicep build --stdout --file
        files: '\.bicep$'
        # Runs the built-in Bicep linter; fails on error-level rules.
        # --stdout writes compiled ARM JSON to stdout (no .json artifact).

  # ────────────────────────────────────────────────────────────────
  # PSRule for Azure — manual stage only (opt-in, slow)
  # Run: pixi run -e dev lint-psrule
  # Requires: pwsh + PSRule.Rules.Azure module installed on host
  # ────────────────────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: psrule
        name: PSRule for Azure (manual)
        language: system
        stages: [manual]
        entry: pwsh -NoProfile -Command
          "Invoke-PSRule -Module PSRule.Rules.Azure
          -InputPath . -Option ps-rule.yaml -Outcome Fail,Error"
        pass_filenames: false
